id: 61101
name: tdr2025
environments:
  production:
    domain: thedirectorsroom.com
    scheduler: true
    storage: auditionsuite-production
    memory: 512
    cli-timeout: 900
    cli-memory: 512
    timeout: 30
    runtime: 'php-8.4:al2023'
    database: TDR2025p
    build:
      - 'set COMPOSER_MIRROR_PATH_REPOS=1 && composer install'
      - 'php artisan event:cache'
      - 'php artisan config:cache'
      - 'npm ci && npm run build && rd /s /q "node_modules"'
    deploy: null
  staging:
    storage: auditionsuite-production
    scheduler: false
    memory: 512
    cli-timeout: 900
    cli-memory: 512
    timeout: 30
    runtime: 'php-8.4:al2023'
    database: tdr2025s
    build:
      - 'set COMPOSER_MIRROR_PATH_REPOS=1 && composer install'
      - 'php artisan event:cache'
      - 'npm ci && npm run build && rd /s /q "node_modules"'
    deploy: null
